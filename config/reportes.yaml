# Definición extensible de tipos de reporte.
# Agregar combustible/viajes no requiere reescribir el motor: solo esta config
# (y, si hace falta, ajustar hoja_origen / columnas con un export real).

rutas:
  raiz_salida: "consolidados_onway/_procesados"
  # Fallbacks de lectura: consolidados antiguos generados antes del redireccionamiento
  # siguen apareciendo en el selector de días y se pueden descargar.
  raiz_salida_fallback:
    - "consolidados/_procesados"
    - "alertas_onway/_procesados"
    - "reportes_onway/_procesados"

scheduler:
  habilitado: true
  # Cada 10 minutos revisa los días configurados y procesa si hay archivos nuevos.
  cron: "*/10 * * * *"
  timezone: "America/Lima"
  # D6: a las ~8 am se suben los reportes del día anterior. Se revisan "ayer" y "hoy".
  dias_a_revisar: ["ayer", "hoy"]
  # No procesar un día si algún .xlsx de entrada cambió hace menos de N segundos
  # (evita procesar una carga a medias).
  estabilidad_segundos: 120
  # Reprocesar solo si cambió la cantidad / tamaño / fecha de los archivos del día.
  solo_si_cambio: true

reportes:
  alertas:
    habilitado: true
    etiqueta: "Alertas"
    # Raíz principal (renombrada). Con el sufijo _entrada_fecha_:
    #   <carpeta_raiz>/<fecha>/<carpeta_entrada>/*.xlsx  (recomendada)
    #   <carpeta_raiz>/<mes>/<fecha-dmy>/<carpeta_entrada>/*.xlsx  (actual)
    # También se prueba sin /<carpeta_entrada> (compatibilidad estructura actual).
    carpeta_raiz: "alertas_onway"
    carpeta_raiz_fallback:
      - "reportes_onway"
    carpeta_entrada: "alertas"
    hoja_origen: "Report Alerts"
    columna_placa: "Placa/Patente"
    columna_alerta: "Alerta"
    columna_severidad: "Severidad de la alerta"
    columnas_obligatorias:
      - "Fecha"
      - "Hora"
      - "Alerta"
      - "Placa/Patente"
    columnas_plantilla:
      - "Secuencia"
      - "Grupo"
      - "Alias"
      - "Placa/Patente"
      - "IMEI"
      - "Tipo de carrocería"
      - "Empresa"
      - "Conductor"
      - "Fecha"
      - "Hora"
      - "Latitud"
      - "Longitud"
      - "Dirección"
      - "Alerta"
      - "Odómetro (Km)"
      - "Zona"
      - "Velocidad (Km/h)"
      - "Horómetro (Hrs)"
      - "% Batería"
      - "Fecha GPS"
      - "Hora GPS"
      - "Estado GPS"
      - "Atención Alerta"
      - "Fecha Registro At."
      - "Hora Registro At."
    podar_columnas_vacias: true
    nombre_salida: "REPORTE_ALERTAS_{fecha}.xlsx"

  combustible:
    habilitado: false
    etiqueta: "Combustible"
    carpeta_raiz: "combustible_onway"
    carpeta_entrada: "combustible"
    hoja_origen: "Fuel Report"
    columna_placa: "Placa/Patente"
    columnas_obligatorias:
      - "Fecha"
      - "Placa/Patente"
    columnas_plantilla: []
    podar_columnas_vacias: true
    nombre_salida: "REPORTE_COMBUSTIBLE_{fecha}.xlsx"

  viajes:
    habilitado: false
    etiqueta: "Viajes"
    carpeta_raiz: "viajes_onway"
    carpeta_entrada: "viajes"
    hoja_origen: "Trips Report"
    columna_placa: "Placa/Patente"
    columnas_obligatorias:
      - "Fecha"
      - "Placa/Patente"
    columnas_plantilla: []
    podar_columnas_vacias: true
    nombre_salida: "REPORTE_VIAJES_{fecha}.xlsx"

  historial:
    habilitado: true
    etiqueta: "Historial"
    carpeta_raiz: "historial_onway"
    carpeta_entrada: "historial"
    hoja_origen: "Report History"
    columna_placa: "Placa/Patente"
    # Nota: en historial "Alerta" NO es obligatoria (la mayoría son puntos GPS sin evento).
    columnas_obligatorias:
      - "Fecha"
      - "Hora"
      - "Placa/Patente"
    # Export real de Onway (21 columnas). El mapeo es por nombre, el orden no afecta.
    columnas_plantilla:
      - "Secuencia"
      - "Grupo"
      - "Alias"
      - "Placa/Patente"
      - "Etiquetas"
      - "IMEI"
      - "Tipo de carrocería"
      - "Empresa"
      - "Conductor"
      - "Fecha"
      - "Hora"
      - "Latitud"
      - "Longitud"
      - "Dirección"
      - "Alerta"
      - "Odómetro (Km)"
      - "Zona/Marca"
      - "Velocidad (Km/h)"
      - "Horómetro (Hrs)"
      - "% Batería"
      - "Notas"
    podar_columnas_vacias: true
    nombre_salida: "REPORTE_HISTORIAL_{fecha}.xlsx"

# Reportes compuestos: combinan la salida ya normalizada de 2+ reportes base.
reportes_compuestos:
  consolidado_diario:
    key_publico: "consolidado"
    etiqueta: "Consolidado"
    habilitado: true
    tipos_incluidos:
      - "alertas"
      - "historial"
    columna_origen: "Origen del registro"
    # "fecha_hora" (mezcla cronológica) | "por_origen" (bloques separados)
    orden_filas: "fecha_hora"
    podar_columnas_vacias: true
    nombre_salida: "REPORTE_CONSOLIDADO_{fecha}.xlsx"

# Analítica de flota (v1.4): hojas RESUMEN_FLOTA, VUELTAS y VISITAS en el
# consolidado + datos para la vista "Operación de flota" del dashboard.
# Con habilitado: false el consolidado es idéntico al v1.3.
analitica_flota:
  habilitado: true
  aplica_a: [consolidado]            # D2: solo el consolidado
  fuente_eventos: "alertas"          # nunca el historial mezclado (H8)
  dedupe_segundos: 120               # mismo tipo y zona repetido en <= 120 s -> duplicado
  fusion_rebote_minutos: 10          # Llegó a la misma zona <= 10 min tras Salió -> misma visita
  paso_por_zona_segundos: 180        # H6: estancia en tienda < 3 min = paso por zona
  max_tiendas_por_vuelta_en_hoja: 7
  max_vueltas_en_resumen: 4
  resaltar_estancia_bsf_min: 240     # H7; recalibrar con datos reales
  inicio_jornada_alertas: ["Vehículo encendido"]
  inicio_jornada_respaldo: ["Se movio"]     # marcado "estimado"
  ignorar_para_inicio: ["Encendido o Entró en cobertura", "Inicio de ralentí",
                        "Fin de ralentí", "Fuente principal conectada",
                        "Fuente principal desconectada", "Batería baja"]
  # Rango horario del Gantt / ocupación BSF en el dashboard
  gantt_hora_inicio: 4
  gantt_hora_fin: 20
  ocupacion_bsf_minutos: 15
